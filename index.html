<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PK Health Rx - ใบสั่งสุขภาพดิจิทัล อบจ.ประจวบคีรีขันธ์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0f766e;--p2:#14b8a6;--bg:#f1f5f9;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
#hdr{background:linear-gradient(135deg,#0f766e,#0369a1);color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#hdr .logo{background:#fff;border-radius:10px;padding:3px;object-fit:contain}
.ht{flex:1;min-width:220px}.ht h1{margin:0;font-size:1.35rem}.ht p{margin:3px 0 0;opacity:.9;font-size:.8rem}
.hu{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;text-align:right}
.hu span{opacity:.9}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{border:0;background:#f1f5f9;padding:9px 14px;border-radius:999px;cursor:pointer;font:inherit;color:var(--tx)}
nav button.on{background:var(--p);color:#fff;font-weight:600}
main{max-width:1150px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2,.card h3{margin-top:0}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;border-left:5px solid var(--p2)}
.kpi b{display:block;font-size:1.6rem;color:var(--p)}.kpi span{color:var(--mut);font-size:.83rem}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}
button.btn{background:var(--p);color:#fff;border:0;padding:10px 18px;border-radius:8px;font:inherit;cursor:pointer;font-weight:600}
button.btn.sec{background:#e2e8f0;color:var(--tx)}button.btn.red{background:#dc2626}
button.btn:disabled{opacity:.6;cursor:wait}
button.sm{padding:4px 10px;font-size:.8rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{background:#f8fafc;color:var(--mut);font-weight:600}
td.r,th.r{text-align:right}.scroll{overflow-x:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
.b-green{background:#dcfce7;color:#166534}.b-yellow{background:#fef9c3;color:#854d0e}
.b-orange{background:#ffedd5;color:#9a3412}.b-red{background:#fee2e2;color:#991b1b}
.bar{display:grid;grid-template-columns:200px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:.85rem}
.bar div{background:#e2e8f0;border-radius:999px;height:12px;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px}
.prog{background:#e2e8f0;border-radius:999px;height:10px;overflow:hidden;min-width:90px}.prog i{display:block;height:100%;background:var(--p2)}
.note{background:#ecfeff;border:1px solid #a5f3fc;border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.warn{background:#fef2f2;border:1px solid #fecaca}
.mut{color:var(--mut);font-size:.85rem}
.fb{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.lg{font-size:.88rem;margin:4px 0}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
.lgs{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;margin-top:4px}.lgs i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:middle}
.rx{border:3px double var(--p);border-radius:14px;padding:22px;background:#fff}
.rx .top{text-align:center}.rx h2{text-align:center;color:var(--p);margin:6px 0 4px}
.rx .sub{text-align:center;color:var(--mut);margin-bottom:14px;font-size:.9rem}
.rx dl{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;margin:0}.rx dt{color:var(--mut)}.rx dd{margin:0;font-weight:600}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px;text-align:center;font-size:.9rem}.sign div{border-top:1px dotted #000;padding-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:20px}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#0f766e,#0369a1)}
.lcard{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
.lcard h1{margin:8px 0 2px;color:var(--p)}.lcard p{margin:0 0 14px;color:var(--mut);font-size:.88rem}
.lcard form{text-align:left}.lcard input{font-size:1.2rem;letter-spacing:2px;margin-bottom:8px}
.lerr{color:#dc2626;font-size:.88rem;min-height:20px;margin-bottom:6px}.hint{font-size:.8rem;color:var(--mut)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;display:none;z-index:99}
@media print{body *{visibility:hidden}#rxcard,#rxcard *{visibility:visible}#rxcard{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div id="login"></div>
<div id="app" style="display:none">
 <div id="hdr"></div>
 <nav id="nav"></nav>
 <main id="main"></main>
 <footer>ข้อมูลสุขภาพเป็นข้อมูลส่วนบุคคลตาม PDPA โปรดออกจากระบบทุกครั้งหลังใช้งาน | เครื่องมือช่วยคัดกรองเบื้องต้น ไม่ใช่การวินิจฉัยโรค</footer>
</div>
<div id="toast"></div>

<script>
/* =================== ตั้งค่า =================== */
const CONFIG={
 SHEETS_URL:'',                 // วาง URL Web App ของ Google Apps Script ที่นี่ (หรือตั้งในหน้า "ผู้ดูแลระบบ")
 LOGO_URL:'logo-pkk-pao.png',   // ไฟล์โลโก้ อบจ.ประจวบฯ วางไว้โฟลเดอร์เดียวกับ index.html
 ADMIN_CODE:'00000',            // รหัสผู้ดูแลระบบ (อบจ.)
 ADMIN_PIN:'pk2570',            // PIN เริ่มต้นของผู้ดูแล (ระบบบังคับเปลี่ยนเมื่อเข้าครั้งแรก) ต้องตรงกับ Code.gs
 SALT:'pk2570|',                // ต้องตรงกับ Code.gs
 IDLE_MIN:20,TARGET:400
};

/* =================== รายชื่อ รพ.สต. 44 แห่ง (รหัส|ชื่อ|อำเภอ) =================== */
const FAC_RAW=`08740|รพ.สต.ทับใต้|หัวหิน
08736|รพ.สต.บ้านเขาเต่า|หัวหิน
08696|รพ.สต.บ้านโป่งกระสัง|กุยบุรี
08699|รพ.สต.บ้านหนองหอย|ทับสะแก
08702|รพ.สต.เขาล้าน|ทับสะแก
14212|รพ.สต.บ้านทุ่งประดู่|ทับสะแก
08709|รพ.สต.พงศ์ประศาสน์|บางสะพาน
08710|รพ.สต.ร่อนทอง|บางสะพาน
08714|รพ.สต.ธงชัย|บางสะพาน

08716|รพ.สต.บ้านห้วยไก่ต่อ|บางสะพาน
08707|รพ.สต.บ้านหนองตาจ่า|บางสะพาน

08722|รพ.สต.บางสะพาน|บางสะพานน้อย

08672|รพ.สต.บ้านหนองบัว|เมืองฯ
08674|รพ.สต.คลองวาฬ|เมืองฯ
08681|สถานีอนามัยเฉลิมพระเกียรติ 60 พรรษา นวมินทราชินี (บ้านนิคม กม.5)|เมืองฯ
08746|รพ.สต.บ้านหนองหญ้าปล้อง|สามร้อยยอด
08749|รพ.สต.บ้านหนองแก|สามร้อยยอด

08735|รพ.สต.เขาจ้าว|ปราณบุรี
08729|รพ.สต.ปราณบุรี|ปราณบุรี
08744|รพ.สต.สามร้อยยอด|สามร้อยยอด
14216|รพ.สต.บ้านหนองจิก|สามร้อยยอด
08690|รพ.สต.เขาแดง|กุยบุรี
08673|รพ.สต.บ้านทุ่งเคล็ด|เมืองฯ
08684|รพ.สต.บ้านดอนซอ|เมืองฯ
08683|รพ.สต.บ่อนอก|เมืองฯ
08675|รพ.สต.ด่านสิงขร|เมืองฯ
08676|รพ.สต.บ้านห้วยน้ำพุ|เมืองฯ

08698|รพ.สต.บ้านอ่างทอง|ทับสะแก
08701|รพ.สต.นาหูกวาง|ทับสะแก
08715|รพ.สต.บ้านหนองมงคล|บางสะพาน
08708|รพ.สต.บ้านทุ่งขี้ต่าย|บางสะพาน
08719|รพ.สต.บ้านทองมงคล|บางสะพาน
08720|รพ.สต.แม่รำพึง|บางสะพาน
08713|รพ.สต.บ้านถ้ำคีรีวงศ์|บางสะพาน
08725|รพ.สต.ช้างแรก|บางสะพานน้อย
08728|รพ.สต.บ้านบางเจริญ|บางสะพานน้อย`;
const CITY='เมืองประจวบคีรีขันธ์';
const FAC=FAC_RAW.split('\n').map(l=>{const[c,n,d]=l.split('|');return{code:c.trim(),name:n.trim(),dist:d.trim()==='เมืองฯ'?CITY:d.trim()}});
const FACM=Object.fromEntries(FAC.map(f=>[f.code,f]));
const DISTRICTS=[CITY,'กุยบุรี','ทับสะแก','บางสะพาน','บางสะพานน้อย','ปราณบุรี','หัวหิน','สามร้อยยอด'];
const sd=d=>d===CITY?'เมืองฯ':d;

const BUDGET=[
 {id:'a1-1',act:1,name:'ค่าอาหารกลางวัน (100 คน × 200)',amt:20000},
 {id:'a1-2',act:1,name:'ค่าอาหารว่างและเครื่องดื่ม (100 × 50 × 2 มื้อ)',amt:10000},
 {id:'a1-3',act:1,name:'ค่าวิทยากร (2 คน × 6 ชม. × 1,200)',amt:14400},
 {id:'a1-4',act:1,name:'ค่าเอกสาร ป้ายไวนิล และวัสดุ',amt:5600},
 {id:'a2-1',act:2,name:'ชุดตรวจน้ำตาลปลายนิ้วและวัสดุคัดกรอง',amt:120000},
 {id:'a2-2',act:2,name:'สมุดบันทึกใบสั่งสุขภาพและอุปกรณ์ออกกำลังกาย (400 × 200)',amt:80000},
 {id:'a2-3',act:2,name:'ค่าใช้จ่ายติดตามเยี่ยมบ้านของ อสม.',amt:100000},
 {id:'a2-4',act:2,name:'ค่าวิทยากรนำออกกำลังกายกลุ่มในชุมชน',amt:60000},
 {id:'a2-5',act:2,name:'คลินิกสุขภาพนอกเวลา',amt:70000},
 {id:'a2-6',act:2,name:'ระบบข้อมูล Web App (โฮสติ้ง/อินเทอร์เน็ต/อบรม)',amt:50000},
 {id:'a2-7',act:2,name:'ติดตามประเมินผลและถอดบทเรียน',amt:70000}
];
const ACT_NAME={1:'กิจกรรมที่ 1: ประชุมสร้างความร่วมมือภาคีเครือข่ายและพัฒนาศักยภาพทีมงาน',2:'กิจกรรมที่ 2: ขับเคลื่อนใบสั่งสุขภาพ "ออกกำลังกายเป็นยา" ในชุมชน'};
const LV={refer:['ส่งต่อแพทย์','b-red'],high:['เสี่ยงสูง','b-orange'],mid:['เสี่ยงปานกลาง','b-yellow'],low:['เสี่ยงต่ำ','b-green']};
const LVC={low:'#22c55e',mid:'#eab308',high:'#f97316',refer:'#ef4444'};

/* =================== ตัวช่วยทั่วไป =================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n).toLocaleString('th-TH');
const today=()=>new Date().toLocaleDateString('en-CA');
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
const thDate=s=>new Date(s+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}

/* =================== ค่าตั้งต้น / เซสชัน / ฐานข้อมูล =================== */
let cfg=JSON.parse(localStorage.getItem('pkhealthrx.cfg')||'{}');
const saveCfg=()=>localStorage.setItem('pkhealthrx.cfg',JSON.stringify(cfg));
const url=()=>(cfg.url||CONFIG.SHEETS_URL||'').trim();
let pins=JSON.parse(localStorage.getItem('pkhealthrx.pins')||'{}');
const savePins=()=>localStorage.setItem('pkhealthrx.pins',JSON.stringify(pins));
let SESS=JSON.parse(sessionStorage.getItem('pkhealthrx.sess')||'null');
const saveSess=()=>sessionStorage.setItem('pkhealthrx.sess',JSON.stringify(SESS));
const isAdmin=()=>!!SESS&&SESS.code===CONFIG.ADMIN_CODE;

const DBK='pkhealthrx.v2';
function fresh(){return{participants:[],logs:[],assess:[],spent:{},metaUpd:0,lp:{},partners:[
 {name:'องค์การบริหารส่วนจังหวัดประจวบคีรีขันธ์ (กองสาธารณสุข)',type:'อปท.',role:'เจ้าภาพหลัก / สนับสนุนงบประมาณ / กำหนดมาตรฐานและข้อมูลระดับจังหวัด',contact:''},
 {name:'สำนักงานสาธารณสุขจังหวัด/อำเภอ',type:'หน่วยงานสาธารณสุข',role:'โค้ชหน้างานระดับอำเภอ',contact:''},
 {name:'โรงพยาบาลส่งเสริมสุขภาพตำบล (รพ.สต.) 44 แห่ง',type:'หน่วยบริการปฐมภูมิ',role:'คัดกรอง ออกใบสั่งสุขภาพ ติดตามผล',contact:''},
 {name:'อาสาสมัครสาธารณสุข (อสม.) / แกนนำสุขภาพ',type:'อาสาสมัคร',role:'เยี่ยมบ้าน คู่หูสุขภาพ จัดกิจกรรมออกกำลังกายกลุ่ม',contact:''},
 {name:'โรงพยาบาลแม่ข่าย',type:'โรงพยาบาล',role:'รับส่งต่อผู้ที่น้ำตาลสูง/ต้องพบแพทย์',contact:''}]}}
let db=(()=>{try{const d=JSON.parse(localStorage.getItem(DBK));return d&&d.participants?Object.assign(fresh(),d):fresh()}catch(e){return fresh()}})();
const saveRaw=()=>localStorage.setItem(DBK,JSON.stringify(db));
let syncTimer;
function save(){saveRaw();schedSync()}
function schedSync(){if(!SESS||!url()||cfg.auto===false||SESS.must)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),5000)}

let tab='dash',selRx='',selLog='',selOut='',fD='',fF='',qReg='',IDX={};

/* =================== เข้ารหัส PIN =================== */
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const hashPin=(code,pin)=>sha(CONFIG.SALT+code+':'+pin);
const defHash=code=>hashPin(code,code===CONFIG.ADMIN_CODE?CONFIG.ADMIN_PIN:code);

/* =================== เรียก Google Apps Script =================== */
async function api(action,extra={},cred){
 const c=cred||{code:SESS.code,hash:SESS.hash};
 const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
 try{
  const r=await fetch(url(),{method:'POST',body:JSON.stringify({action,fac:c.code,hash:c.hash,...extra}),signal:ctl.signal});
  return await r.json();
 }finally{clearTimeout(t)}
}

/* =================== โลโก้ =================== */
const logoSrc=()=>cfg.logo||CONFIG.LOGO_URL;
const PH_LOGO='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#0f766e"/><circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-width="3"/><path d="M44 28h12v16h16v12H56v16H44V56H28V44h16z" fill="#fff"/></svg>');
const logoImg=h=>`<img class="logo" style="height:${h}px;width:${h}px" src="${esc(logoSrc())}" alt="โลโก้ อบจ.ประจวบคีรีขันธ์" onerror="this.onerror=null;this.src=PH_LOGO">`;
function upLogo(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,256/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cfg.logo=c.toDataURL('image/png');saveCfg();buildHeader();render();toast('เปลี่ยนโลโก้แล้ว (เก็บเฉพาะเครื่องนี้)')};im.src=r.result};
 r.readAsDataURL(f);
}
function resetLogo(){delete cfg.logo;saveCfg();buildHeader();render()}

/* =================== เข้าสู่ระบบ =================== */
function showLogin(msg){
 $('#app').style.display='none';const L=$('#login');L.style.display='flex';
 L.innerHTML=`<div class="lcard">${logoImg(90)}<h1>PK Health Rx</h1>
 <p>โครงการรวมพลังภาคีเครือข่ายสร้างเสริมสุขภาพจังหวัดประจวบคีรีขันธ์<br>องค์การบริหารส่วนจังหวัดประจวบคีรีขันธ์</p>
 <form onsubmit="return doLogin(event)">
  <label>เลขสถานพยาบาล 5 หลัก (ชื่อผู้ใช้)</label>

async function doLogin(e){
 e.preventDefault();

 if(!(code===CONFIG.ADMIN_CODE||FACM[code]))return err('ไม่พบเลขสถานพยาบาลนี้ในรายชื่อ');
 if(!(window.crypto&&crypto.subtle))return err('เบราว์เซอร์นี้ไม่รองรับการเข้ารหัส กรุณาเปิดผ่าน https หรือใช้ Chrome/Edge รุ่นใหม่');
 const lk=JSON.parse(localStorage.getItem('pkhealthrx.lock')||'{}');
 if(lk[code]&&lk[code].until>Date.now())return err(`ใส่ PIN ผิดหลายครั้ง กรุณารอ ${Math.ceil((lk[code].until-Date.now())/60000)} นาที`);
 $('#lb').disabled=true;
 const h=await hashPin(code,pin);
 let ok=false,isDef=false,via='local';
 if(url()){
  try{
   const r=await api('login',{},{code,hash:h});
   if(r.ok){ok=true;isDef=!!r.isDefault;via='server'}
   else if(r.err==='auth'){via='server'}
   else throw new Error(r.err);
  }catch(x){via='local'}
 }
 if(via==='local'){const dh=await defHash(code);ok=(pins[code]||dh)===h;isDef=!pins[code]}
 if(!ok){
  const f=lk[code]||{n:0};f.n++;if(f.n>=5){f.until=Date.now()+5*60000;f.n=0}lk[code]=f;localStorage.setItem('pkhealthrx.lock',JSON.stringify(lk));
  return err('เลขสถานพยาบาลหรือ PIN ไม่ถูกต้อง');
 }
 delete lk[code];localStorage.setItem('pkhealthrx.lock',JSON.stringify(lk));
 if(isDef)delete pins[code];else pins[code]=h;savePins();
 SESS={code,hash:h,must:isDef};saveSess();start();return false;
}

/* =================== ขอบเขตข้อมูลตามสิทธิ์ =================== */
const inScope=r=>isAdmin()||r.fac===SESS.code;
function PP(){return db.participants.filter(p=>!p.del&&inScope(p)&&(!isAdmin()||((!fD||p.district===fD)&&(!fF||p.fac===fF)))).sort((a,b)=>a.id.localeCompare(b.id))}
function buildIdx(){
 IDX={days:{},as:{}};
 db.logs.forEach(l=>{if(l.del)return;const d=IDX.days[l.pid]||(IDX.days[l.pid]={});d[l.date]=(d[l.date]||0)+l.min});
 db.assess.forEach(a=>{if(a.del)return;(IDX.as[a.pid]||(IDX.as[a.pid]={}))[a.phase]=a});
}

/* =================== ตรรกะหลัก =================== */
function calc(w,hcm,fpg,covid){
 const bmi=w/Math.pow(hcm/100,2);let s=0;
 if(bmi>=30)s+=2;else if(bmi>=25)s+=1.5;else if(bmi>=23)s+=1;
 if(fpg>=126)s+=3;else if(fpg>=100)s+=2;
 if(covid)s+=1;
 return{bmi:+bmi.toFixed(1),score:s,level:fpg>=126?'refer':s>=4?'high':s>=2?'mid':'low'};
}
function nextId(fac){let m=0;db.participants.forEach(p=>{if(p.fac===fac){const n=+p.id.split('-')[1];if(n>m)m=n}});return fac+'-'+String(m+1).padStart(4,'0')}
function addP(o){const p={...o,...calc(o.weight,o.height,o.glucose,o.covid),id:nextId(o.fac),start:o.start||today(),upd:Date.now()};db.participants.push(p);return p}
function putAssess(p,ph,o){const id=p.id+'#'+ph;db.assess=db.assess.filter(a=>a.id!==id);db.assess.push({id,pid:p.id,fac:p.fac,phase:ph,...o,upd:Date.now()})}
function addLog(p,o){db.logs.push({id:'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),pid:p.id,fac:p.fac,...o,upd:Date.now()})}
const sessions=pid=>Object.values(IDX.days[pid]||{}).filter(v=>v>=30).length;
const adh=pid=>Math.min(100,Math.round(sessions(pid)/60*100));
function weekDays(p,w){let c=0;const d=IDX.days[p.id]||{};for(let k=0;k<7;k++)if((d[addDays(p.start,7*(w-1)+k)]||0)>=30)c++;return c}
const weekNo=p=>Math.max(1,Math.floor((new Date(today())-new Date(p.start+'T00:00:00'))/(7*864e5))+1);
function outc(p){const a=IDX.as[p.id]||{};const b=a[0]||{weight:p.weight,glucose:p.glucose,walk:null};const l=a[12]||a[6];return l?{b,l}:null}
const fname=c=>FACM[c]?FACM[c].name:c;
const opts=sel=>'<option value="">-- เลือกผู้เข้าร่วม --</option>'+PP().map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${p.id} - ${esc(p.name)}</option>`).join('');
const badge=l=>`<span class="badge ${LV[l][1]}">${LV[l][0]}</span>`;
const bars=(rows,max)=>rows.map(([l,v,c])=>`<div class="bar"><span>${esc(l)}</span><div><i style="width:${max?v/max*100:0}%;background:${c||'var(--p)'}"></i></div><b>${v}</b></div>`).join('');

/* =================== กราฟ SVG =================== */
const niceMax=m=>{const p=Math.pow(10,Math.floor(Math.log10(m)));const f=m/p;return(f<=1?1:f<=2?2:f<=4?4:f<=8?8:10)*p};
const fmtT=v=>v>=1000?(+(v/1000).toFixed(1))+'k':+(+v).toFixed(1);
const legend=s=>s.length>1?`<div class="lgs">${s.map(x=>`<span><i style="background:${x.color}"></i>${esc(x.name)}</span>`).join('')}</div>`:'';
function svgBars(labels,series,o={}){
 const W=560,H=240,L=44,R=10,T=14,B=40,pw=W-L-R,ph=H-T-B;
 const mx=o.max||niceMax(Math.max(1,...series.flatMap(s=>s.vals.map(v=>v||0))));
 let g='';
 for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e2e8f0"/><text x="${L-5}" y="${y+4}" text-anchor="end" font-size="10" fill="#64748b">${fmtT(mx*i/4)}</text>`}
 const n=labels.length,gw=pw/n,bw=Math.min(34,gw*.75/series.length);
 labels.forEach((lb,i)=>{
  const x0=L+gw*i+gw/2-bw*series.length/2;
  series.forEach((s,j)=>{const v=s.vals[i]||0,h=ph*v/mx;
   g+=`<rect x="${x0+bw*j}" y="${T+ph-h}" width="${bw-2}" height="${h}" rx="3" fill="${s.color}"><title>${esc(s.name)}: ${nf(v)}</title></rect>`;
   if(v)g+=`<text x="${x0+bw*j+(bw-2)/2}" y="${T+ph-h-3}" text-anchor="middle" font-size="9" fill="#334155">${fmtT(v)}</text>`});
  g+=`<text x="${L+gw*i+gw/2}" y="${H-B+15}" text-anchor="middle" font-size="10.5" fill="#334155">${esc(lb)}</text>`;
 });
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg>${legend(series)}`;
}
function svgLine(labels,series,o={}){
 const all=series.flatMap(s=>s.vals).filter(v=>v!=null);
 if(!all.length)return '<p class="mut">ยังไม่มีข้อมูล</p>';
 const W=560,H=220,L=48,R=16,T=14,B=34,pw=W-L-R,ph=H-T-B;
 let lo=o.min!=null?o.min:Math.min(...all),hi=o.max!=null?o.max:Math.max(...all);
 if(hi===lo){hi+=1;lo-=1}
 if(o.min==null)lo-=(hi-lo)*.15;if(o.max==null)hi+=(hi-lo)*.15;
 const X=i=>L+(labels.length>1?pw*i/(labels.length-1):pw/2),Y=v=>T+ph-ph*(v-lo)/(hi-lo);
 let g='';
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e2e8f0"/><text x="${L-5}" y="${y+4}" text-anchor="end" font-size="10" fill="#64748b">${+v.toFixed(1)}</text>`}
 labels.forEach((lb,i)=>g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="10.5" fill="#334155">${esc(lb)}</text>`);
 series.forEach(s=>{
  let d='',pen=false;
  s.vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i)+' '+Y(v);pen=true});
  g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
  s.vals.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.color}"><title>${esc(s.name)} ${esc(labels[i])}: ${v}</title></circle><text x="${X(i)}" y="${Y(v)-8}" text-anchor="middle" font-size="9.5" fill="#334155">${v}</text>`});
 });
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg>${legend(series)}`;
}
function svgDonut(d){
 const tot=d.reduce((s,x)=>s+x[1],0),r=52,C=2*Math.PI*r;let acc=0;
 const arcs=tot?d.filter(x=>x[1]>0).map(([l,v,c])=>{const len=v/tot*C;const el=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${c}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"><title>${l}: ${v}</title></circle>`;acc+=len;return el}).join(''):`<circle r="${r}" cx="70" cy="70" fill="none" stroke="#e2e8f0" stroke-width="22"/>`;
 return `<div class="donut"><svg viewBox="0 0 140 140" width="150" height="150">${arcs}<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">${tot}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="#64748b">คน</text></svg><div>${d.map(([l,v,c])=>`<div class="lg"><i style="background:${c}"></i>${l}: <b>${v}</b></div>`).join('')}</div></div>`;
}

function vDash(){
 const P=PP(),n=P.length;
 const ad=n?Math.round(P.reduce((s,p)=>s+adh(p.id),0)/n):0;
 const done=P.filter(p=>adh(p.id)>=80).length;
 const oc=P.map(p=>{const o=outc(p);return o?{dw:o.l.weight-o.b.weight,pw:(o.l.weight-o.b.weight)/o.b.weight*100,dg:o.l.glucose-o.b.glucose,dwk:o.b.walk&&o.l.walk?o.l.walk-o.b.walk:null}:null}).filter(Boolean);
 const avg=k=>{const v=oc.filter(x=>x[k]!=null);return v.length?(v.reduce((s,x)=>s+x[k],0)/v.length).toFixed(1):'-'};
 const cnt=l=>P.filter(p=>p.level===l).length;
 const showTarget=isAdmin()&&!fD&&!fF;
 const spent=Object.values(db.spent).reduce((a,b)=>a+(+b||0),0);
 const wk=[...Array(12)].map((_,i)=>{const w=i+1,A=P.filter(p=>addDays(p.start,7*(w-1))<=today());return A.length?Math.round(A.reduce((s,p)=>s+Math.min(5,weekDays(p,w))/5*100,0)/A.length):null});
 const bins=[0,0,0,0,0];P.forEach(p=>{const a=adh(p.id);bins[Math.min(4,Math.floor(a/20))]++});
 const phAvg=k=>[0,6,12].map(ph=>{const v=P.map(p=>(IDX.as[p.id]||{})[ph]).filter(a=>a&&a[k]!=null).map(a=>a[k]);return v.length?+(v.reduce((s,x)=>s+x,0)/v.length).toFixed(1):null});
 const PHL=['สัปดาห์ 0','สัปดาห์ 6','สัปดาห์ 12'];
 let distChart='',top='';
 if(isAdmin()){

  distChart=chartCard('ผู้เข้าร่วมรายอำเภอ',svgBars(dc.map(x=>x[0]),[{name:'ผู้เข้าร่วม',color:'#0f766e',vals:dc.map(x=>x[1])},{name:'ปฏิบัติตามใบสั่ง ≥ 80%',color:'#f59e0b',vals:dc.map(x=>x[2])}]));
  const fc=FAC.map(f=>[f.name,P.filter(p=>p.fac===f.code).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  top=chartCard('10 อันดับ รพ.สต. ที่มีผู้เข้าร่วมมากที่สุด',fc.length?bars(fc.map(x=>[x[0],x[1]]),fc[0][1]):'<p class="mut">ยังไม่มีข้อมูล</p>');
 }
 return `${filt()}

  ${isAdmin()?`<div class="kpi"><b>${(spent/6000).toFixed(1)}%</b><span>เบิกจ่ายแล้ว ${nf(spent)} บาท</span></div>`:''}
 </div>
 <div class="grid g3">

function submitReg(e){

 putAssess(p,0,{date:p.start,weight:p.weight,glucose:p.glucose,walk:null});
 save();selRx=p.id;alert(`บันทึกแล้ว: ${p.name}\nรหัส ${p.id}\nBMI ${p.bmi} | ระดับ: ${LV[p.level][0]}`);render();return false;
}
function delP(id){
 if(!confirm('ลบผู้เข้าร่วมและข้อมูลที่เกี่ยวข้อง?'))return;
 const t=Date.now();
 db.participants.forEach(p=>{if(p.id===id){p.del=1;p.upd=t}});
 db.logs.forEach(l=>{if(l.pid===id){l.del=1;l.upd=t}});
 db.assess.forEach(a=>{if(a.pid===id){a.del=1;a.upd=t}});
 save();render();
}

function vBud(){
 const tot={1:0,2:0},sp={1:0,2:0};let html='';
 [1,2].forEach(a=>{
  const items=BUDGET.filter(b=>b.act===a);items.forEach(b=>{tot[a]+=b.amt;sp[a]+=+db.spent[b.id]||0});
  html+=`<div class="card"><h3>${ACT_NAME[a]}</h3><div class="scroll"><table><tr><th>รายการ</th><th class="r">งบที่ตั้ง</th><th class="r">เบิกจ่ายจริง</th><th class="r">คงเหลือ</th></tr>
  ${items.map(b=>{const s=+db.spent[b.id]||0;return `<tr><td>${esc(b.name)}</td><td class="r">${nf(b.amt)}</td><td class="r"><input type="number" min="0" style="width:120px;text-align:right" value="${s||''}" onchange="setSpent('${b.id}',this.value)"></td><td class="r" style="color:${b.amt-s<0?'#dc2626':'inherit'}">${nf(b.amt-s)}</td></tr>`}).join('')}
  <tr><th>รวม</th><th class="r">${nf(tot[a])}</th><th class="r">${nf(sp[a])}</th><th class="r">${nf(tot[a]-sp[a])}</th></tr></table></div></div>`;
 });
 const T=tot[1]+tot[2],S=sp[1]+sp[2];
 return `<div class="kpis"><div class="kpi"><b>${nf(T)}</b><span>งบรวมโครงการ (บาท)</span></div><div class="kpi"><b>${nf(S)}</b><span>เบิกจ่ายแล้ว</span></div><div class="kpi"><b>${nf(T-S)}</b><span>คงเหลือ</span></div><div class="kpi"><b>${(S/T*100).toFixed(1)}%</b><span>ร้อยละการเบิกจ่าย</span></div></div>

}

 return `<div class="card"><h2>ตั้งค่าระบบ</h2>
 <div class="grid g2"><div><label>URL Google Apps Script (Web App)</label><input id="cu" value="${esc(url())}" placeholder="https://script.google.com/macros/s/.../exec"></div>
 <div><label>ซิงค์อัตโนมัติ (หลังบันทึก 5 วินาที)</label><select id="ca"><option value="1" ${cfg.auto!==false?'selected':''}>เปิด</option><option value="0" ${cfg.auto===false?'selected':''}>ปิด</option></select></div></div>
 <div class="actions"><button class="btn" onclick="saveSet()">บันทึกการตั้งค่า</button><button class="btn sec" onclick="testConn()">ทดสอบการเชื่อมต่อ</button></div>
 <p class="mut">การตั้งค่านี้เก็บเฉพาะเครื่องนี้ หากต้องการให้ทุกเครื่องใช้ร่วมกัน ให้ใส่ URL ในตัวแปร CONFIG.SHEETS_URL ที่ต้นสคริปต์ของไฟล์ index.html</p>
 <hr style="border:0;border-top:1px solid var(--bd);margin:14px 0">
 <label>โลโก้ อบจ.ประจวบคีรีขันธ์ (อัปโหลดเก็บเฉพาะเครื่องนี้ หรือวางไฟล์ ${esc(CONFIG.LOGO_URL)} ไว้ข้าง index.html)</label>
 <div class="actions" style="align-items:center">${logoImg(56)}<button class="btn sec" onclick="$('#lg').click()">อัปโหลดโลโก้</button><button class="btn sec" onclick="resetLogo()">ใช้ค่าเริ่มต้น</button><input type="file" id="lg" accept="image/*" style="display:none" onchange="upLogo(event)"></div></div>
 <div class="card"><h3>รหัสสถานพยาบาล 44 แห่ง (ชื่อผู้ใช้ของแกนนำ)</h3>
 <div class="actions" style="margin:0 0 10px"><button class="btn sec" onclick="exportFac()">ดาวน์โหลดรายชื่อ CSV</button><button class="btn red" onclick="resetAll()">ล้างข้อมูลในเครื่องนี้</button></div>
 <div class="scroll"><table><tr><th>รหัส</th><th>หน่วยบริการ</th><th>อำเภอ</th><th class="r">ผู้เข้าร่วม</th><th class="r">ปฏิบัติตามเฉลี่ย</th><th>จัดการ</th></tr>${rows}</table></div></div>`;
}
function saveSet(){cfg.url=$('#cu').value.trim();cfg.auto=$('#ca').value==='1';saveCfg();toast('บันทึกการตั้งค่าแล้ว')}
async function testConn(){saveSet();if(!url()){alert('ยังไม่ได้ใส่ URL');return}
 try{const r=await api('login');alert(r.ok?'เชื่อมต่อ Google Sheets สำเร็จ':'เชื่อมต่อได้ แต่ถูกปฏิเสธ: '+(r.err||''))}catch(e){alert('เชื่อมต่อไม่ได้: '+e.message)}}
async function resetPin(code){
 if(!confirm(`รีเซ็ต PIN ของ ${code} ${fname(code)} ให้กลับเป็นเลข 5 หลักเดิม?`))return;
 if(url()){try{const r=await api('resetpin',{target:code});if(!r.ok)throw new Error(r.err)}catch(e){alert('รีเซ็ตบนเซิร์ฟเวอร์ไม่สำเร็จ: '+e.message);return}}
 delete pins[code];savePins();toast('รีเซ็ต PIN แล้ว (ผู้ใช้ต้องตั้ง PIN ใหม่เมื่อเข้าครั้งถัดไป)');
}
function exportFac(){download('pk-facilities.csv','\uFEFF'+['รหัสสถานพยาบาล,ชื่อ,อำเภอ',...FAC.map(f=>`="${f.code}",${f.name.replace(/,/g,' ')},${f.dist}`)].join('\n'),'text/csv;charset=utf-8')}

/* ---------- บัญชีของฉัน ---------- */
function vAcc(){
 return `<div class="card"><h2>${SESS.must?'กรุณาตั้ง PIN ใหม่ก่อนใช้งาน':'บัญชีของฉัน'}</h2>
 ${SESS.must?'<div class="note warn">คุณกำลังใช้ PIN เริ่มต้น ระบบกำหนดให้เปลี่ยนก่อนเข้าใช้งานส่วนอื่น</div>':''}
 <p><b>${esc(isAdmin()?'ผู้ดูแลระบบ อบจ.ประจวบคีรีขันธ์':fname(SESS.code))}</b> | รหัส ${SESS.code}</p>
 <form onsubmit="return changePin(event)" style="max-width:360px">
  <label>PIN ปัจจุบัน</label><input type="password" name="old" required autocomplete="current-password">
  <label style="margin-top:8px">PIN ใหม่ (อย่างน้อย 6 ตัว และต้องไม่ใช่เลขสถานพยาบาล)</label><input type="password" name="n1" minlength="6" required autocomplete="new-password">
  <label style="margin-top:8px">ยืนยัน PIN ใหม่</label><input type="password" name="n2" minlength="6" required autocomplete="new-password">
  <p><button class="btn">เปลี่ยน PIN</button></p></form></div>`;
}
async function changePin(e){
 e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),code=SESS.code;
 if(await hashPin(code,f.old)!==SESS.hash){alert('PIN ปัจจุบันไม่ถูกต้อง');return false}
 if(f.n1.length<6||f.n1===code||f.n1===CONFIG.ADMIN_PIN){alert('PIN ใหม่ต้องมีอย่างน้อย 6 ตัว และไม่ซ้ำกับค่าเริ่มต้น');return false}
 if(f.n1!==f.n2){alert('PIN ยืนยันไม่ตรงกัน');return false}
 const nh=await hashPin(code,f.n1);
 if(url()){try{const r=await api('setpin',{newHash:nh});if(!r.ok)throw new Error(r.err)}catch(x){alert('ตั้ง PIN บนเซิร์ฟเวอร์ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่: '+x.message);return false}}
 pins[code]=nh;savePins();SESS.hash=nh;SESS.must=false;saveSess();
 alert('เปลี่ยน PIN สำเร็จ');tab='dash';render();if(url())sync(false);return false;
}

/* =================== ซิงค์ Google Sheets =================== */
function mergeIn(tbl,rows){
 const m=new Map(db[tbl].map(r=>[r.id,r]));let ch=0;
 rows.forEach(r=>{if(!r||!r.id)return;const o=m.get(r.id);if(!o||(r.upd||0)>(o.upd||0)){m.set(r.id,r);ch++}});
 db[tbl]=[...m.values()];return ch;
}
let syncing=false;
const setStat=t=>{const s=$('#sst');if(s)s.textContent=t};
async function sync(manual){
 if(!url()){if(manual)alert('ยังไม่ได้ตั้งค่า Google Sheets (ผู้ดูแลระบบตั้งได้ในแท็บ "ผู้ดูแลระบบ")');return}
 if(syncing||!SESS||SESS.must)return;syncing=true;setStat('กำลังซิงค์...');
 const t0=Date.now();
 try{
  const r=await api('pull');if(!r.ok)throw new Error(r.err||'pull failed');
  let ch=0;
  ['participants','logs','assess'].forEach(t=>ch+=mergeIn(t,(r.data[t]||[]).filter(inScope)));
  if(isAdmin()&&r.meta&&(r.meta.upd||0)>(db.metaUpd||0)){db.spent=r.meta.spent||{};db.partners=r.meta.partners||db.partners;db.metaUpd=r.meta.upd;ch++}
  saveRaw();
  const since=db.lp[SESS.code]||0,mine=t=>db[t].filter(x=>inScope(x)&&(x.upd||0)>since);
  const body={participants:mine('participants'),logs:mine('logs'),assess:mine('assess')};
  if(isAdmin())body.meta={spent:db.spent,partners:db.partners,upd:db.metaUpd||Date.now()};
  const p=await api('push',body);if(!p.ok)throw new Error(p.err||'push failed');
  db.lp[SESS.code]=t0;saveRaw();
  setStat('ซิงค์ล่าสุด '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}));
  if(ch||manual)render();if(manual)toast('ซิงค์สำเร็จ');
 }catch(e){setStat('ซิงค์ไม่สำเร็จ');if(manual)alert('ซิงค์ไม่สำเร็จ: '+e.message)}
 finally{syncing=false}
}
window.addEventListener('online',()=>{if(SESS)schedSync()});

/* =================== เครื่องมือข้อมูล =================== */
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportCSV(){
 const h=['รหัสผู้เข้าร่วม','รหัสสถานพยาบาล','ชื่อ','อายุ','เพศ','อำเภอ','รพ.สต.','น้ำหนัก','ส่วนสูง','BMI','น้ำตาล','โควิด','ระดับเสี่ยง','คู่หู','วันเริ่ม','วันออกกำลังกายครบเกณฑ์','ร้อยละปฏิบัติตาม'];
 const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
 const rows=PP().map(p=>[p.id,`="${p.fac}"`,p.name,p.age,p.sex,p.district,p.rpst,p.weight,p.height,p.bmi,p.glucose,p.covid?'เคย':'ไม่เคย',LV[p.level][0],p.asm,p.start,sessions(p.id),adh(p.id)].map(q).join(','));
 download(`pk-health-rx-${SESS.code}.csv`,'\uFEFF'+[h.map(q).join(','),...rows].join('\n'),'text/csv;charset=utf-8');
}
function backup(){
 const o={v:2,participants:db.participants.filter(inScope),logs:db.logs.filter(inScope),assess:db.assess.filter(inScope)};
 if(isAdmin()){o.spent=db.spent;o.partners=db.partners}
 download(`pk-health-rx-backup-${SESS.code}-${today()}.json`,JSON.stringify(o),'application/json');
}
function restore(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.participants)throw 0;
  ['participants','logs','assess'].forEach(t=>mergeIn(t,(d[t]||[]).filter(inScope)));
  save();render();alert('กู้คืนข้อมูลสำเร็จ (รวมเฉพาะข้อมูลที่อยู่ในสิทธิ์ของคุณ)')}catch(x){alert('ไฟล์ไม่ถูกต้อง')}};
 r.readAsText(f);
}
function resetAll(){if(confirm('ล้างข้อมูลทั้งหมดในเครื่องนี้? (ข้อมูลใน Google Sheets ไม่ถูกลบ) แนะนำให้สำรองก่อน')){db=fresh();saveRaw();render()}}
function demo(){
 if(!confirm('โหลดข้อมูลตัวอย่าง 10 คน?'))return;
 const N=['สมชาย ใจดี','สมหญิง รักสุข','ประเสริฐ ทองดี','วิภา สายชล','มานะ ศรีสุข','อรทัย บุญมา','สุรชัย แก้วใส','นภา จันทร์เพ็ญ','ธีรพงษ์ คงมั่น','ลำดวน พรหมมา'];
 N.forEach((n,i)=>{
  const F=isAdmin()?FAC[(i*5)%FAC.length]:FACM[SESS.code];
  const h=150+Math.floor(Math.random()*25),w=Math.round((24+Math.random()*10)*Math.pow(h/100,2)),g=85+Math.floor(Math.random()*35);
  const p=addP({fac:F.code,name:'(ตัวอย่าง) '+n,age:30+Math.floor(Math.random()*35),sex:i%2?'หญิง':'ชาย',district:F.dist,rpst:F.name,weight:w,height:h,glucose:g,covid:i%3!==0,asm:'แกนนำตัวอย่าง',start:addDays(today(),-45)});
  for(let d=44;d>=0;d--)if(Math.random()<.7)addLog(p,{date:addDays(today(),-d),min:20+Math.floor(Math.random()*30),type:'เดินเร็ว',note:''});
  putAssess(p,0,{date:p.start,weight:p.weight,glucose:p.glucose,walk:380+Math.floor(Math.random()*80)});
  putAssess(p,6,{date:addDays(p.start,42),weight:+(p.weight-Math.random()*3).toFixed(1),glucose:Math.max(80,p.glucose-Math.floor(Math.random()*10)),walk:430+Math.floor(Math.random()*80)});
 });
 save();render();
}
function clearDemo(){
 if(!confirm('ลบข้อมูลตัวอย่างทั้งหมดที่ขึ้นต้นด้วย "(ตัวอย่าง)"?'))return;
 const t=Date.now(),ids=new Set(db.participants.filter(p=>!p.del&&inScope(p)&&p.name.startsWith('(ตัวอย่าง)')).map(p=>p.id));
 db.participants.forEach(p=>{if(ids.has(p.id)){p.del=1;p.upd=t}});
 db.logs.forEach(l=>{if(ids.has(l.pid)){l.del=1;l.upd=t}});
 db.assess.forEach(a=>{if(ids.has(a.pid)){a.del=1;a.upd=t}});
 save();render();toast(`ลบข้อมูลตัวอย่าง ${ids.size} รายการ`);
}

/* =================== เริ่มทำงาน =================== */
if(SESS&&(FACM[SESS.code]||SESS.code===CONFIG.ADMIN_CODE))start();else{SESS=null;showLogin()}
</script>
